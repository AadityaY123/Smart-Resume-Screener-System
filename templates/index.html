<!DOCTYPE html>
<html>

<head>

    <title>AI Resume Matcher</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            padding:40px;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            width:500px;
            margin:auto;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
        }

        input{
            margin-top:10px;
            margin-bottom:20px;
        }

        button{
            padding:10px 20px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Resume & JD Matcher</h1>

        <form
            action="/match"
            method="POST"
            enctype="multipart/form-data"
        >

            <label>
                Upload Resume PDF
            </label>

            <br>

            <input
                type="file"
                name="resume"
                required
            >

            <br>

            <label>
                Upload Job Description PDF
            </label>

            <br>

            <input
                type="file"
                name="jd"
                required
            >

            <br>

            <button type="submit">
                Match Resume
            </button>

        </form>

    </div>

</body>

</html>
